name: Build Standalone APK
on: 
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من داخل GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Expo tools
        run: npm install -g eas-cli

      - name: Generate native projects
        run: npx expo prebuild --clean

      - name: Build APK with EAS
        run: eas build --platform android --local --output=./app-build.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }} # اختر خيار --non-interactive إذا واجهت مشاكل

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: ./app-build.apk
